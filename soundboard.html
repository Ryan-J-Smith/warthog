<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WARTHOG Soundboard</title>
    <style>
      :root {
        --bg: #0d0f0a;
        --panel: #161a10;
        --line: #2b3220;
        --text: #d6dcb4;
        --muted: #8c9470;
        --accent: #e0b84a;
        --hot: #e5553a;
        --ok: #8fc15a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      header { position: sticky; top: 0; z-index: 2; background: rgba(13, 15, 10, 0.96); border-bottom: 1px solid var(--line); padding: 14px 20px 12px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
      header h1 { margin: 0; font-size: 20px; letter-spacing: 0.18em; color: var(--accent); }
      header .summary { color: var(--muted); }
      header label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
      header button { margin-left: auto; }
      main { padding: 8px 20px 60px; max-width: 1280px; }
      h2 { margin: 28px 0 8px; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
      .row { display: grid; grid-template-columns: 170px 170px 1fr; gap: 6px 18px; padding: 10px 12px; margin: 6px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
      .row.playing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
      .key { font-weight: 700; color: var(--text); word-break: break-all; }
      .kind { font-size: 11px; color: var(--muted); }
      .controls { display: flex; flex-direction: column; gap: 6px; }
      .controls .buttons { display: flex; gap: 6px; }
      button { font: inherit; color: var(--bg); background: var(--accent); border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-weight: 700; white-space: nowrap; }
      button.stop { background: var(--line); color: var(--text); }
      button:disabled { opacity: 0.4; cursor: default; }
      .meta { color: var(--muted); font-size: 12px; }
      .note { color: var(--text); }
      .credit { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .credit a { color: var(--accent); }
      .lic { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 700; margin-right: 6px; }
      .lic.cc0 { background: #2f4a1e; color: var(--ok); }
      .lic.by { background: #4a3c14; color: var(--accent); }
      .lic.orig { background: #22304a; color: #9cc3ff; }
      .err { color: var(--hot); }
      @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>WARTHOG SOUNDBOARD</h1>
      <span class="summary" id="summary">loading…</span>
      <label>volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
      <button class="stop" id="stopAll">stop all</button>
    </header>
    <main id="board"></main>
    <script type="module" src="/src/soundboard/main.ts"></script>
  </body>
</html>
